# Squadrons observe-mode tool surface.
# Applied as a per-launch --patch overlay on `dsh --profile sdk`.
# Keeps web/todo/goal/skill; disables coding/shell mutation tooling.

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
