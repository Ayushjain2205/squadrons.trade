# Squadrons observe-mode tool surface.
# Applied as a per-launch --patch overlay on `dsh --profile sdk`.
# Keeps todo/goal/skill + web_fetch; disables coding/shell mutation tooling.
# DeepSeek-backed web_search is disabled — search_x uses free keyless backends.

- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true
# Prevents web_search from routing to DeepSeek (needs DEEPSEEK_API_KEY).
# search_x (squadrons-social) does not use ctx.web.
- id: web-search-deepseek
  disabled: true
- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()
